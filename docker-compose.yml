services:
  # PostgreSQL Database (dev + test databases)
  db:
    image: postgres:15-alpine
    container_name: cellophanemail_db
    environment:
      POSTGRES_USER: cellophane_user
      POSTGRES_PASSWORD: docker_dev_pass_2024
      POSTGRES_DB: cellophanemail
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    networks:
      - cellophanemail
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cellophane_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (Optional - use with --profile cache)
  redis:
    image: redis:7-alpine
    container_name: cellophanemail_redis
    ports:
      - "6379:6379"
    networks:
      - cellophanemail
    profiles:
      - cache
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Database Migrations (dev)
  migrate:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: cellophanemail_migrate
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - DATABASE_URL=postgresql://cellophane_user:docker_dev_pass_2024@db:5432/cellophanemail
      - UV_CACHE_DIR=/tmp/uv-cache
    volumes:
      - .:/app
      - container_venv:/app/.venv
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cellophanemail
    command: ["uv", "run", "piccolo", "migrations", "forwards", "all"]
    restart: "no"

  # Database Migrations (test)
  migrate-test:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: cellophanemail_migrate_test
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - DATABASE_URL=postgresql://cellophane_user:docker_dev_pass_2024@db:5432/cellophanemail_test
      - UV_CACHE_DIR=/tmp/uv-cache
    volumes:
      - .:/app
      - container_venv:/app/.venv
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - cellophanemail
    command: ["uv", "run", "piccolo", "migrations", "forwards", "all"]
    restart: "no"
    profiles:
      - test

  # Litestar API Server
  app:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: cellophanemail_app
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - DEBUG=1
      - DATABASE_URL=postgresql://cellophane_user:docker_dev_pass_2024@db:5432/cellophanemail
      - REDIS_URL=redis://redis:6379/0
      - UV_CACHE_DIR=/tmp/uv-cache
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - container_venv:/app/.venv
      - /app/src/cellophanemail.egg-info  # Prevent overwriting
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - cellophanemail
    env_file:
      - .env.docker
    command: ["uv", "run", "uvicorn", "cellophanemail.app:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # SMTP Email Server
  smtp:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: cellophanemail_smtp
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - DEBUG=1
      - SMTP_HOST=0.0.0.0
      - SMTP_PORT=2525
      - DATABASE_URL=postgresql://cellophane_user:docker_dev_pass_2024@db:5432/cellophanemail
      - UV_CACHE_DIR=/tmp/uv-cache
    ports:
      - "2525:2525"
    volumes:
      - .:/app
      - container_venv:/app/.venv
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - cellophanemail
    env_file:
      - .env.docker
    command: ["uv", "run", "python", "-m", "cellophanemail.plugins.smtp"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s = socket.socket(); s.connect(('localhost', 2525)); s.close()\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # arq Worker (Redis-backed async job queue)
  arq-worker:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: cellophanemail_arq_worker
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - DEBUG=1
      - DATABASE_URL=postgresql://cellophane_user:docker_dev_pass_2024@db:5432/cellophanemail
      - REDIS_URL=redis://redis:6379/0
      - UV_CACHE_DIR=/tmp/uv-cache
    volumes:
      - .:/app
      - container_venv:/app/.venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - cellophanemail
    env_file:
      - .env.docker
    profiles:
      - cache
    command: ["uv", "run", "arq", "cellophanemail.jobs.settings.WorkerSettings"]
    restart: unless-stopped

volumes:
  postgres_data:
  container_venv:  # Isolates container .venv from host — prevents broken symlinks

networks:
  cellophanemail:
    driver: bridge
